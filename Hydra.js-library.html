<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydra.js Library</title>
    
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111;
      }
      
      canvas {
        display: block;
        max-width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
    
    <script>
      /* global Hydra, osc */
      function setup () {
        const canvas = document.createElement('canvas')
        // Changed the canvas from 600 x 600 to 800 x 500
        canvas.width = 800
        canvas.height = 500
        
        const hydra = new Hydra({
          canvas,
          detectAudio: false
        })
        
        // Changed the frequency from 10 to 18 for more stripes
        // Changed movement speed from 0.1 to 0.15.
        osc(18, 0.15, 1.2)
          // Changed the color tint to emphasize blue.
          .color(0.3, 0.6, 1)
          // Added a kaleidescope effect to canvas
          .kaleid(6)
          // Added slow, continuous rotation
          .rotate(0, 0.08)
          .out()
        
        document.body.appendChild(hydra.canvas)
      }
      
      window.addEventListener('load', setup)
    </script>
  </body>
</html>
